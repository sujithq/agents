name: PPTX to Sora Video

on:
  workflow_dispatch:
    inputs:
      pptx_path:
        description: "Path to the PPTX to convert"
        required: true
        default: input/deck.pptx

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SORA_ENDPOINT: ${{ secrets.SORA_ENDPOINT }}
      SORA_DEPLOYMENT: ${{ secrets.SORA_DEPLOYMENT }}
      SORA_API_KEY: ${{ secrets.SORA_API_KEY }}
      SORA_API_VERSION: ${{ secrets.SORA_API_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract slides
        run: |
          python .github/skills/pptx-slides-notes/scripts/extract_slides.py \
            --pptx "${{ inputs.pptx_path }}" \
            --out output/slides

      - name: Extract notes
        run: |
          python .github/skills/pptx-slides-notes/scripts/extract_notes.py \
            --pptx "${{ inputs.pptx_path }}" \
            --out output/notes

      - name: Submit Sora jobs
        run: |
          python .github/skills/sora2-video/scripts/sora_generate.py \
            --slides output/slides \
            --notes output/notes \
            --out output/video

      - name: Poll Sora jobs
        run: |
          python .github/skills/sora2-video/scripts/poll_jobs.py \
            --manifest output/video/manifest.json

      - name: Stitch final video
        run: |
          bash .github/skills/sora2-video/scripts/stitch_ffmpeg.sh \
            output/video/clips \
            output/video/final.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: pptx-video
          path: output/video/
